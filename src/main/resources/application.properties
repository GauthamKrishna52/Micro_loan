spring.application.name=Micro_loan

# PostgreSQL datasource (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/Micro-loan
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT config
jwt.secret=microloan-super-secret-key-2026-change-me-locally
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Refresh cookie config
app.cookie.name=refresh_token
app.cookie.path=/
app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.max-age-seconds=604800
