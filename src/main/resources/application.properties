spring.application.name=Micro_loan

# Local defaults are intentionally credential-free. Supply database credentials
# and JWT_SECRET through the process environment (or a local, ignored .env file).
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Micro-loan}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep schema update for initial deployment until managed migrations are added.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# JWT_SECRET is mandatory and must contain at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Set APP_COOKIE_SECURE=true on Render (HTTPS).
app.cookie.name=${APP_COOKIE_NAME:refresh_token}
app.cookie.path=${APP_COOKIE_PATH:/}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.max-age-seconds=${APP_COOKIE_MAX_AGE_SECONDS:604800}
